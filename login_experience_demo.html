<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入體驗・示範</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#15100b; --wood-1:#3a2817; --wood-2:#2c1d11; --wood-3:#241808;
    --parch-hi:#f6ead0; --parch:#ecdcb4; --parch-lo:#dcc794;
    --ink:#2b2012; --seal:#b5402e; --gold:#d9a441; --gold-deep:#9c7320; --ember:#ff8a3d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;max-width:430px;margin:0 auto;
    min-height:100vh;color:var(--parch);overflow:hidden;position:relative;
    background:linear-gradient(180deg,#241a11,#15100b)}

  /* ===================== A：酒館門入場 ===================== */
  .scene{position:fixed;inset:0;max-width:430px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 32px;text-align:center}

  #sceneLogin{
    background:
      radial-gradient(130% 50% at 50% 8%, rgba(255,180,90,.16), transparent 60%),
      repeating-linear-gradient(90deg, transparent 0 70px, rgba(0,0,0,.4) 70px 72px, transparent 72px 74px),
      repeating-linear-gradient(2deg, rgba(0,0,0,.05) 0 3px, transparent 3px 9px),
      linear-gradient(170deg, var(--wood-1), var(--wood-2) 55%, var(--wood-3));
    box-shadow:inset 0 0 90px rgba(0,0,0,.7);
  }

  /* 油燈光暈：淡入＋搖曳 */
  .lamp{position:absolute;top:6%;left:50%;transform:translateX(-50%);
    width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,90,.26), transparent 68%);
    filter:blur(8px);opacity:0;animation:lamp-on 1.2s ease .2s forwards, flick 4s ease-in-out 1.4s infinite}
  @keyframes lamp-on{to{opacity:1}}
  @keyframes flick{0%,100%{opacity:.92}45%{opacity:1}70%{opacity:.82}}

  /* 招牌：垂降晃動 */
  .signboard{position:relative;margin-bottom:8px;opacity:0;
    animation:sign-drop 1s cubic-bezier(.34,1.4,.5,1) .5s forwards}
  @keyframes sign-drop{0%{opacity:0;transform:translateY(-40px) rotate(-3deg)}
    70%{opacity:1;transform:translateY(4px) rotate(1.5deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
  .eyebrow{font-family:'DotGothic16';font-size:12px;letter-spacing:.4em;color:var(--gold-deep);text-indent:.4em;
    opacity:0;animation:fade-up .8s ease 1s forwards}
  .title{font-family:'DotGothic16';font-size:34px;letter-spacing:.06em;color:var(--gold);margin-top:6px;
    text-shadow:0 2px 0 #160f08, 0 0 22px rgba(255,180,90,.3);
    opacity:0;animation:fade-up .8s ease 1.15s forwards}
  .subtitle{font-size:14px;color:#c9a866;margin-top:14px;letter-spacing:.08em;
    opacity:0;animation:fade-up .8s ease 1.35s forwards}
  @keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  .rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0 0;
    opacity:0;animation:fade-up .8s ease 1.25s forwards}
  .rule::before,.rule::after{content:"";height:1px;width:40px}
  .rule::before{background:linear-gradient(90deg,transparent,var(--gold-deep))}
  .rule::after{background:linear-gradient(90deg,var(--gold-deep),transparent)}
  .rule span{font-size:11px;color:#b08a52;letter-spacing:.2em}

  /* LINE 登入鈕：最後登場 */
  .line-btn{display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:44px;width:100%;max-width:300px;
    background:#06c755;color:#fff;padding:15px 28px;border-radius:10px;
    text-decoration:none;font-weight:700;font-size:16px;letter-spacing:.05em;cursor:pointer;
    box-shadow:0 6px 0 #04923f, 0 10px 22px rgba(6,199,85,.35);
    opacity:0;animation:btn-pop .6s cubic-bezier(.34,1.56,.64,1) 1.7s forwards;
    transition:transform .06s, box-shadow .06s}
  .line-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #04923f, 0 5px 14px rgba(6,199,85,.35)}
  @keyframes btn-pop{0%{opacity:0;transform:scale(.8) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  .line-ic{width:22px;height:22px;background:#fff;border-radius:6px;color:#06c755;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
  .hint{margin-top:18px;font-size:11px;color:#8a7250;letter-spacing:.05em;
    opacity:0;animation:fade-up .8s ease 2s forwards}

  /* ===================== B：核發執照過場 ===================== */
  #sceneIssue{background:rgba(10,7,4,.96);opacity:0;pointer-events:none;
    transition:opacity .5s ease;backdrop-filter:blur(2px)}
  #sceneIssue.show{opacity:1;pointer-events:auto}

  .issue-label{font-family:'DotGothic16';font-size:13px;letter-spacing:.3em;color:var(--gold-deep);
    margin-bottom:22px;opacity:0}
  #sceneIssue.show .issue-label{animation:fade-up .6s ease .2s forwards}

  /* 執照卡：飛入＋鋼印蓋下 */
  .license-card{position:relative;width:300px;border-radius:12px;padding:22px 22px 20px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 8px),
      linear-gradient(155deg,#2e4756,#28323f 55%,#1f2731);
    border:1px solid rgba(224,176,74,.4);
    box-shadow:0 14px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0;transform:translateY(40px) scale(.9)}
  #sceneIssue.show .license-card{animation:card-in .7s cubic-bezier(.34,1.4,.5,1) .4s forwards}
  @keyframes card-in{to{opacity:1;transform:translateY(0) scale(1)}}
  .license-card::after{content:"⚔";position:absolute;right:-8px;bottom:-20px;font-size:110px;
    color:rgba(224,176,74,.07);transform:rotate(-12deg)}

  .lc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .lc-label{font-family:'DotGothic16';font-size:10px;letter-spacing:.3em;color:#9fb4c4}
  .lc-no{font-family:'DotGothic16';font-size:11px;color:var(--gold);
    opacity:0}
  #sceneIssue.show .lc-no{animation:type-in .4s ease 1.5s forwards}
  .lc-name{font-family:'DotGothic16';font-size:24px;color:#fff;letter-spacing:.04em;
    opacity:0}
  #sceneIssue.show .lc-name{animation:fade-up .5s ease 1s forwards}
  .lc-rank{display:inline-block;margin-top:3px;font-size:13px;color:var(--gold);font-weight:700;
    opacity:0}
  #sceneIssue.show .lc-rank{animation:fade-up .5s ease 1.2s forwards}
  @keyframes type-in{to{opacity:1}}

  /* 鋼印：旋轉砸下 */
  .stamp{position:absolute;top:50%;left:50%;width:120px;height:120px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:5px solid var(--seal);color:var(--seal);
    font-family:'DotGothic16';font-size:15px;text-align:center;line-height:1.3;
    transform:translate(-50%,-50%) scale(3) rotate(-25deg);opacity:0;
    box-shadow:0 0 0 2px rgba(181,64,46,.3) inset}
  #sceneIssue.show .stamp{animation:stamp-down .5s cubic-bezier(.5,0,.4,1.4) 1.8s forwards}
  @keyframes stamp-down{
    0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-25deg)}
    60%{opacity:.95;transform:translate(-50%,-50%) scale(.95) rotate(-13deg)}
    75%{transform:translate(-50%,-50%) scale(1.08) rotate(-13deg)}
    100%{opacity:.9;transform:translate(-50%,-50%) scale(1) rotate(-13deg)}}

  .welcome{margin-top:26px;font-family:'DotGothic16';font-size:17px;color:var(--gold);letter-spacing:.06em;
    opacity:0;text-shadow:0 0 16px rgba(217,164,65,.4)}
  #sceneIssue.show .welcome{animation:fade-up .6s ease 2.4s forwards}
  .enter-hint{margin-top:10px;font-size:11px;color:#8a7250;opacity:0}
  #sceneIssue.show .enter-hint{animation:fade-up .6s ease 2.8s forwards}

  .replay{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:11px;color:#6b563a;font-family:'DotGothic16';cursor:pointer;
    border:1px solid #6b563a;border-radius:4px;padding:6px 14px;background:rgba(0,0,0,.3);z-index:99}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>

<!-- ===== A：登入頁 ===== -->
<div class="scene" id="sceneLogin">
  <div class="lamp"></div>
  <div class="signboard">
    <div class="eyebrow">FOOD HUNTER GUILD</div>
    <div class="title">美食獵人協會</div>
    <div class="rule"><span>酒 館</span></div>
  </div>
  <div class="subtitle">推開門，領取你的獵人執照</div>

  <a class="line-btn" id="lineBtn">
    <span class="line-ic">L</span> 使用 LINE 登入
  </a>
  <div class="hint">首次登入將為你核發專屬執照</div>
</div>

<!-- ===== B：核發執照過場 ===== -->
<div class="scene" id="sceneIssue">
  <div class="issue-label">獵 人 執 照 核 發 中</div>
  <div class="license-card">
    <div class="lc-top">
      <span class="lc-label">獵 人 執 照</span>
      <span class="lc-no">TW-2026-A3F09C</span>
    </div>
    <div class="lc-name">富毅</div>
    <div class="lc-rank">Lv.1　見習獵人</div>
    <div class="stamp">公會<br>認證</div>
  </div>
  <div class="welcome">歡迎加入狩獵，獵人。</div>
  <div class="enter-hint">正在進入酒館…</div>
</div>

<div class="replay" id="replay">⟳ 重播動畫</div>

<script>
const sceneIssue = document.getElementById('sceneIssue');
document.getElementById('lineBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  // 真實版：這裡會先跳 LINE OAuth，callback 回來後才顯示 B
  sceneIssue.classList.add('show');
  // 真實版：B 過場跑完 → window.location = '/'（進酒館）
});
document.getElementById('replay').addEventListener('click', ()=>{
  sceneIssue.classList.remove('show');
});
</script>
</body>
</html>
