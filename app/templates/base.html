<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}美食獵人執照{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #2a1d12;
      --parchment:#f3e6c4;
      --red:      #b5402e;
      --gold:     #d9a441;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--parchment);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100dvh;
      max-width: 390px;
      margin: 0 auto;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div id="loading-overlay" style="position:fixed;inset:0;z-index:9999;background:#241808;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease;">
    <div style="font-size:2.2rem;margin-bottom:16px;animation:ld-pulse 1.2s infinite">⚔</div>
    <div style="font-family:'DotGothic16',monospace;color:#d9a441;font-size:.95rem;letter-spacing:.1em">正在開啟卷軸...</div>
    <div style="margin-top:14px;width:120px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden">
      <div id="ld-bar" style="height:100%;background:linear-gradient(90deg,#b5402e,#d9a441);border-radius:2px;animation:ld-bar 1.5s ease-in-out infinite"></div>
    </div>
  </div>
  <style>
    @keyframes ld-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    @keyframes ld-bar{0%{width:0;margin-left:0}50%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}
    #loading-overlay.done{opacity:0;pointer-events:none}
  </style>
  <script>
    window.addEventListener('load',function(){
      setTimeout(function(){
        var el=document.getElementById('loading-overlay');
        if(el){el.classList.add('done');setTimeout(function(){el.remove()},550);}
      },150);
    });
  </script>
  {% block content %}{% endblock %}
</body>
</html>
