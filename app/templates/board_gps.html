{% extends 'base.html' %}
{% block title %}搜索此地 — 美食獵人執照{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:2rem;text-align:center;">
  <div id="state-loading" style="display:none">
    <div style="font-size:3rem;margin-bottom:1rem;">🧭</div>
    <p style="color:var(--gold);font-family:'DotGothic16';margin-bottom:0.5rem;">正在搜索此地…</p>
    <p style="color:var(--parchment);opacity:0.6;font-size:0.85rem;">獵人公會正在掌握你的位置</p>
  </div>

  <div id="state-prompt">
    <div style="font-size:3rem;margin-bottom:1rem;">🧭</div>
    <p style="color:var(--gold);font-family:'DotGothic16';font-size:1.1rem;margin-bottom:0.5rem;">搜索此地</p>
    <p style="color:var(--parchment);opacity:0.6;font-size:0.85rem;margin-bottom:2rem;">需要取得你的位置，才能搜索附近懸賞</p>
    <button id="btn-gps"
      style="background:var(--red);color:var(--parchment);border:none;padding:1rem 2rem;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;">
      允許定位・開始搜索
    </button>
  </div>

  <div id="state-error" style="display:none">
    <div style="font-size:3rem;margin-bottom:1rem;">⚠️</div>
    <p style="color:var(--red);font-family:'DotGothic16';margin-bottom:0.5rem;">無法取得位置</p>
    <p id="error-msg" style="color:var(--parchment);opacity:0.6;font-size:0.85rem;margin-bottom:1.5rem;"></p>
    <button id="btn-retry"
      style="background:transparent;color:var(--gold);border:2px solid var(--gold);padding:0.75rem 1.5rem;border-radius:6px;font-size:0.9rem;cursor:pointer;">
      再試一次
    </button>
    <br>
    <a href="/expedition"
      style="display:inline-block;margin-top:1rem;background:var(--red);color:var(--parchment);padding:0.75rem 1.5rem;border-radius:6px;font-size:0.9rem;text-decoration:none;font-weight:700;">
      🗺 改用遠征模式
    </a>
    <br>
    <a href="/" style="display:inline-block;margin-top:1rem;color:var(--parchment);opacity:0.4;font-size:0.8rem;text-decoration:none;">← 回酒館</a>
  </div>
</div>

<script>
const loading = document.getElementById('state-loading');
const prompt  = document.getElementById('state-prompt');
const errDiv  = document.getElementById('state-error');
const errMsg  = document.getElementById('error-msg');

function startGPS() {
  prompt.style.display = 'none';
  errDiv.style.display = 'none';
  loading.style.display = 'block';

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      window.location.href = `/board?mode=explore&lat=${lat}&lng=${lng}`;
    },
    err => {
      loading.style.display = 'none';
      errDiv.style.display  = 'block';
      const msgs = {
        1: '定位權限被拒絕。請在瀏覽器設定中允許此網站取得位置。',
        2: '無法取得位置訊號，請確認裝置的定位服務已開啟。',
        3: '取得位置逾時，請再試一次。',
      };
      errMsg.textContent = msgs[err.code] || '未知錯誤。';
    },
    { timeout: 12000, maximumAge: 60000, enableHighAccuracy: false }
  );
}

document.getElementById('btn-gps').addEventListener('click', startGPS);
document.getElementById('btn-retry').addEventListener('click', startGPS);

// LINE 內建瀏覽器不支援定位，直接顯示提示
if (/\bLine\b/i.test(navigator.userAgent)) {
  prompt.style.display  = 'none';
  errDiv.style.display  = 'block';
  errMsg.textContent    = 'LINE 瀏覽器無法使用定位功能。請點右上角選單 → 用其他瀏覽器開啟，或改用遠征模式。';
} else if (!navigator.geolocation) {
  prompt.style.display = 'none';
  errDiv.style.display = 'block';
  errMsg.textContent = '你的瀏覽器不支援定位功能。';
}
</script>
{% endblock %}
